<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration - Pakistan Book Store</title>
<link rel="stylesheet" href="Registration.css">
  <link rel="stylesheet" href="password-toggle.css">
  <script src="password-toggle.js"></script>
  <script src="auth.js"></script>
</head>
<body>
    <script>
      // Redirect logged-in users away from registration page
      document.addEventListener('DOMContentLoaded', function() {
        if (checkAuth()) return;
      });
    </script>
  <nav class="navbar">
    <ul>
      <li><a href="Home.html" class="brand" style="text-decoration: none; text-align: center;">PK Book Store</a></li>
      <li><a href="Home.html">Home</a></li>
  <li><a href="Catalog.html" class="auth-required">Catalog</a></li>
  <li><a href="Add Cart.html" class="auth-required">Add Cart</a></li>

      <li><a href="Registration.html">Registration</a></li>

      <li><a href="Profile.html">Profile</a></li>
      <li><a href="LoginPage.html" class="login-btn">Login</a></li>
    </ul>
  </nav>
  <div class="main-content">
    <div class="form-container">
      <h2 style="color:#1a237e;">Register Here</h2>
      <form action="registration.php" method="post">
  <input type="text" placeholder="Enter Username" name="username" required style="width:100%;padding:8px;margin-bottom:12px;border-radius:6px;border:1px solid #b39ddb;">
  <input type="email" placeholder="Enter Email" name="email" required style="width:100%;padding:8px;margin-bottom:12px;border-radius:6px;border:1px solid #b39ddb;">
  <div class="password-container">
    <input type="password" placeholder="Enter Password" name="password" id="registerPassword" required style="width:100%;padding:8px;margin-bottom:12px;border-radius:6px;border:1px solid #b39ddb;">
    <button type="button" class="password-toggle" id="toggleRegisterPassword" onclick="togglePassword('registerPassword', 'toggleRegisterPassword')" title="Show password">👁️‍🗨️</button>
  </div>
  <button type="submit">Register Here</button>
      </form>

  <script>
  document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = this.username.value.trim();
    const email = this.email.value.trim();
    const password = this.password.value;
    const result = registerUser(username, password, email);
    if (!result.success) {
      alert(result.message);
      return;
    }
    // Log in the user after registration
    loginUser(username);
    try { alert('Account created successfully. Welcome ' + username + '!'); } catch (e) {}
    window.location.href = 'Home.html';
  });
  </script>
      <p style="margin-top:16px;">Already have an account? <a href="LoginPage.html" style="color:#3949ab;font-weight:bold;">Login here</a></p>
    </div>
  </div>
  <footer>
    &copy; 2025 Pakistan Book Store. All rights reserved. M. Noor Hasan
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Profile - Pakistan Book Store</title>
	<link rel="stylesheet" href="Profile.css">
	<script src="auth.js"></script>
</head>
<script>
	document.addEventListener('DOMContentLoaded', function() {
		if (!checkAuth()) return;
		const user = getCurrentUser();
		if (user) {
			document.querySelectorAll('.login-btn').forEach(el => { el.textContent = 'Logout'; el.onclick = function(e){ e.preventDefault(); logoutUser(); }; });
		}
	});
</script>
<body>
		<nav class="navbar">
		<ul>
		<li><a href="Home.html" class="brand" style="text-decoration: none; text-align: center;">PK Book Store</a></li>
		<li><a href="Home.html">Home</a></li>
		<li><a href="Catalog.html" class="auth-required">Catalog</a></li>
		<li><a href="Add Cart.html" class="auth-required">Add Cart</a></li>
		<li><a href="OrderPayment.html" class="auth-required">Order Payment</a></li>
		<li><a href="Profile.html" class="active">Profile</a></li>
		<li><a href="LoginPage.html" class="login-btn">Login</a></li>
		</ul>
	</nav>
	<div class="main-content" style="display: flex; justify-content: center; align-items: flex-start; min-height: 80vh; background: #f5f5f5;">
  <div style="max-width: 400px; width: 100%; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(57,73,171,0.10); border: 2px solid #b39ddb; padding: 32px 28px; text-align: center;">
    <h2 style="color:#1a237e; margin-bottom: 24px; font-size:2em; font-family:Arial,sans-serif;">User Profile</h2>
    <div style="margin-bottom: 18px; text-align:left;">
      <label style="font-weight:bold; color:#3949ab;">Username:</label>
      <span id="profile-username" style="margin-left:10px; color:#333;"></span>
    </div>
    <div style="margin-bottom: 18px; text-align:left;">
      <label style="font-weight:bold; color:#3949ab;">Email:</label>
      <span id="profile-email" style="margin-left:10px; color:#333;"></span>
    </div>
    <div style="margin-bottom: 18px; text-align:left;">
      <label style="font-weight:bold; color:#3949ab;">Password:</label>
      <span id="profile-password" style="margin-left:10px; color:#333;"></span>
    </div>
    <div style="margin-bottom: 18px;">
      <button onclick="handleDeleteAccount()" style="width:100%;padding:12px 0;background:#90caf9;color:#1a237e;border:none;border-radius:24px;font-size:1.1em;font-weight:bold;box-shadow:0 2px 8px rgba(57,73,171,0.10);margin-bottom:10px;cursor:pointer;">Delete Account</button>
    </div>
    <hr style="margin:24px 0; border:1px solid #b39ddb;">
    <h3 style="color:#3949ab; margin-bottom:12px;">Purchased History</h3>
    <div id="order-receipts-container" style="display:flex; flex-direction:column; gap:20px; margin-bottom:18px; text-align:left;"></div>
  </div>
</div>
		<hr style="margin:24px 0; border:1px solid #b39ddb;">

<script>
document.addEventListener('DOMContentLoaded', function() {
	const user = getCurrentUser();
	if (!user) return;
	const userInfo = getUser(user.username);
	if (!userInfo) return;
	document.getElementById('profile-username').textContent = userInfo.username;
	document.getElementById('profile-email').textContent = userInfo.email;
	document.getElementById('profile-password').textContent = userInfo.password;

	// Load and display purchased history receipts
	const orders = JSON.parse(localStorage.getItem('orders') || '[]');
	const container = document.getElementById('order-receipts-container');
	container.innerHTML = '';
	let ordersFound = false;
	const userName = (user.username || '').toLowerCase();
	const userEmail = (user.email || '').toLowerCase();
	if (orders.length === 0) {
		container.innerHTML = '<p style="color:#b71c1c;">No orders exist in localStorage. Please complete a purchase first.</p>';
		return;
	}
	orders.slice().reverse().forEach(order => {
		if (!order.buyer) return;
		const buyerName = (order.buyer.username || '').toLowerCase();
		const buyerEmail = (order.buyer.email || '').toLowerCase();
		if (buyerName === userName || buyerEmail === userEmail) {
			ordersFound = true;
			let receiptHtml = `<div style="border:1px solid #ddd; background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.07); padding:18px 20px; margin-bottom:18px;">
				<h3 style="margin:0 0 8px 0; font-size:1.2em; color:#222;">Receipt — ${order.id}</h3>
				<div style="font-size:1em; color:#444; margin-bottom:10px;"><em>${new Date(order.timestamp).toLocaleString()}</em></div>
				<section style="margin-bottom:12px;">
					<h4 style="margin:0 0 4px 0; font-size:1em; color:#222;">Buyer</h4>
					<div style="font-size:1em; color:#222;">${order.buyer.username} — ${order.buyer.email}</div>
					<div style="font-size:0.95em; color:#444;">${order.buyer.address}</div>
				</section>
				<section style="margin-bottom:12px;">
					<h4 style="margin:0 0 4px 0; font-size:1em; color:#222;">Items</h4>
					${(order.items || []).map(it => {
						const t = (parseFloat(it.price)||0) * (parseInt(it.quantity)||1);
						return `<div style=\"display:flex; justify-content:space-between; border-bottom:1px dashed #eee; padding:6px 0;\"><div>${it.title} × ${it.quantity}</div><div>Rs. ${t}</div></div>`;
					}).join('')}
				</section>
				<section style="margin-bottom:8px;">
					<div>Subtotal: Rs. ${order.subtotal}</div>
					<div>Delivery: Rs. ${order.delivery}</div>
					<div style="font-weight:800; margin-top:6px;">Total Paid: Rs. ${order.total}</div>
				</section>
				<div style="margin-top:10px; font-size:0.95em; color:#666">Thank you for your purchase.</div>
				<a href="OrderPayment.html?orderId=${order.id}" style="display:inline-block; margin-top:8px; color:#3949ab; text-decoration:underline; font-size:0.95em;" target="_blank">View Full Receipt</a>
			</div>`;
			container.insertAdjacentHTML('beforeend', receiptHtml);
		}
	});
	if (!ordersFound) {
		container.innerHTML = '<p style="font-style:italic; color:#666;">No completed orders found.</p>';
	}
	
	// Also check user's history from auth.js
	try {
		const userHistory = getUserHistory(user.username);
		if (userHistory && userHistory.booksPurchased && userHistory.booksPurchased.length > 0) {
			// Add a separate section for books purchased from user history
			const booksHistoryHtml = `
				<div style="margin-top: 30px;">
					<h3 style="color:#3949ab; margin-bottom:12px;">Books Purchased History</h3>
					${userHistory.booksPurchased.map(book => {
						return `<div style="border:1px solid #eee; background:#fafafa; border-radius:6px; padding:12px; margin-bottom:10px;">
							<div><strong>${book.title}</strong></div>
							<div>Quantity: ${book.quantity} | Unit Price: Rs. ${book.unitPrice} | Total: Rs. ${book.total}</div>
							<div>Purchased on: ${new Date(book.purchasedAt).toLocaleString()}</div>
						</div>`;
					}).join('')}
				</div>
			`;
			container.insertAdjacentHTML('beforeend', booksHistoryHtml);
		}
	} catch (e) {
		console.log("Could not load user history from auth system");
	}
});

function handleDeleteAccount() {
    const user = getCurrentUser();
    if (!user) return;
    const confirmDelete = confirm(
        "Are you sure you want to delete your account?\n\n" +
        "⚠️ Warning:\n" +
        "- This action cannot be undone\n" +
        "- All your data and history will be permanently deleted\n" +
        "- You won't be able to log in with this account again"
    );
    if (confirmDelete) {
        const result = deleteAccount(user.username);
        if (result.success) {
            alert('Your account has been successfully deleted.');
            window.location.href = 'LoginPage.html';
        } else {
            alert('Error deleting account: ' + result.message);
        }
    }
}
</script>
	</div>
	</div>
	</div>
